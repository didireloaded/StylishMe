<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1218" />
    <title>StylishMe — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        place-items: center;
        color: #f7f2ef;
        background: radial-gradient(circle at 72% 16%, rgba(223, 112, 183, 0.32), transparent 34%), #0b1218;
      }
      main { width: min(100%, 420px); text-align: center; }
      .mark {
        display: grid;
        width: 76px;
        height: 76px;
        margin: 0 auto 26px;
        place-items: center;
        background: linear-gradient(145deg, #df70b7, #ff7c73);
        border-radius: 24px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
        font-family: Georgia, serif;
        font-size: 42px;
      }
      small { color: #ff9a91; font-weight: 700; letter-spacing: 0.16em; }
      h1 { margin: 10px 0 12px; font-family: Georgia, serif; font-size: clamp(32px, 9vw, 46px); font-weight: 400; }
      p { margin: 0 auto 24px; color: #b8b3b5; line-height: 1.65; }
      button {
        min-width: 180px;
        min-height: 48px;
        padding: 12px 22px;
        color: white;
        background: linear-gradient(105deg, #c270d5, #ff8178);
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <small>STYLISHME NAMIBIA</small>
      <h1>You’re offline</h1>
      <p>Live prices, stock and checkout need a connection. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
